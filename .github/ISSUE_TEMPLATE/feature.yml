name: Feature request
description: Suggest an improvement to Open HRMS.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the workflow and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives, configuration needs, and privacy or payroll implications.
    validations:
      required: true
